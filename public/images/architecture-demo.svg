<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e293b"/>
  <text x="50%" y="10%" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle">Security Data Platform Architecture</text>
  
  <!-- Data Sources -->
  <rect x="50" y="200" width="120" height="80" rx="10" fill="#3b82f6" />
  <text x="110" y="245" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Data Sources</text>
  <text x="110" y="265" font-family="Arial" font-size="12" fill="#cbd5e1" text-anchor="middle">(Firewalls/Servers)</text>

  <!-- Logstash -->
  <rect x="250" y="200" width="120" height="80" rx="10" fill="#10b981" />
  <text x="310" y="245" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Logstash</text>

  <!-- Elasticsearch -->
  <rect x="450" y="150" width="120" height="180" rx="10" fill="#f59e0b" />
  <text x="510" y="235" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Elasticsearch</text>
  <text x="510" y="255" font-family="Arial" font-size="12" fill="#fffbeb" text-anchor="middle">Cluster</text>

  <!-- Kibana -->
  <rect x="650" y="200" width="120" height="80" rx="10" fill="#ec4899" />
  <text x="710" y="245" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Kibana</text>

  <!-- Arrows -->
  <line x1="170" y1="240" x2="250" y2="240" stroke="white" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="370" y1="240" x2="450" y2="240" stroke="white" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="570" y1="240" x2="650" y2="240" stroke="white" stroke-width="2" marker-end="url(#arrow)" />

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="white" />
    </marker>
  </defs>
</svg>
