<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
    </marker>
    <!-- Glow Filters -->
    <filter id="glow-source" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="#0f172a" rx="12" />
  
  <!-- Title -->
  <text x="50" y="40" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#e2e8f0">Security Data Platform Architecture</text>

  <!-- ==================== AREA 1: DATA SOURCES (Left) ==================== -->
  
  <!-- Group A: Windows AD -->
  <g transform="translate(50, 80)">
    <rect width="180" height="100" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-dasharray="4,4" />
    <text x="90" y="-10" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Windows Environment</text>
    
    <!-- AD Node -->
    <rect x="20" y="20" width="140" height="30" rx="4" fill="#1e3a8a" stroke="#60a5fa" />
    <text x="90" y="40" font-family="Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle">Windows AD</text>
    
    <!-- Winlogbeat -->
    <rect x="50" y="60" width="80" height="25" rx="4" fill="#be185d" stroke="#f472b6" />
    <text x="90" y="77" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">Winlogbeat</text>
    
    <!-- Internal Arrow -->
    <line x1="90" y1="50" x2="90" y2="60" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Group B: Network Devices -->
  <g transform="translate(50, 240)">
    <rect width="180" height="220" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-dasharray="4,4" />
    <text x="90" y="-10" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Network &amp; Security Devices</text>
    
    <!-- Devices List -->
    <g transform="translate(20, 20)">
      <rect y="0" width="140" height="30" rx="4" fill="#334155" stroke="#64748b" />
      <text x="70" y="20" font-family="Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle">F5 WAF</text>
      
      <rect y="40" width="140" height="30" rx="4" fill="#334155" stroke="#64748b" />
      <text x="70" y="60" font-family="Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle">Fortigate</text>

      <rect y="80" width="140" height="30" rx="4" fill="#334155" stroke="#64748b" />
      <text x="70" y="100" font-family="Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle">Cisco ASA</text>

      <rect y="120" width="140" height="30" rx="4" fill="#334155" stroke="#64748b" />
      <text x="70" y="140" font-family="Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle">Citrix</text>
      
      <rect y="160" width="140" height="30" rx="4" fill="#334155" stroke="#64748b" />
      <text x="70" y="180" font-family="Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle">One Identity</text>
    </g>
  </g>

  <!-- ==================== AREA 2: INGESTION (Middle-Left) ==================== -->
  
  <g transform="translate(300, 200)">
    <rect width="120" height="120" rx="10" fill="#ea580c" stroke="#fed7aa" stroke-width="2" filter="url(#glow-source)" />
    <text x="60" y="65" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#fff" text-anchor="middle">Logstash</text>
    <text x="60" y="85" font-family="Arial, sans-serif" font-size="10" fill="#ffedd5" text-anchor="middle">Parsing &amp;</text>
    <text x="60" y="100" font-family="Arial, sans-serif" font-size="10" fill="#ffedd5" text-anchor="middle">Enrichment</text>
  </g>

  <!-- Connectors: Sources -> Logstash -->
  <!-- From Winlogbeat -->
  <path d="M 230,130 L 265,130 L 265,240 L 290,240" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- From Network Devices (Center point) -->
  <path d="M 230,350 L 265,350 L 265,280 L 290,280" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)" />


  <!-- ==================== AREA 3: STORAGE (Middle-Right) ==================== -->
  
  <g transform="translate(480, 50)">
    <!-- Cluster Boundary -->
    <rect width="320" height="480" rx="16" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6,6" />
    <text x="160" y="30" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#38bdf8" text-anchor="middle">Elasticsearch Cluster</text>
    
    <!-- Hot Zone -->
    <g transform="translate(20, 50)">
      <rect width="280" height="140" rx="8" fill="#422006" fill-opacity="0.5" stroke="#eab308" stroke-width="1" />
      <text x="140" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#facc15" text-anchor="middle">Hot Data Nodes (x3)</text>
      
      <!-- Nodes -->
      <g transform="translate(20, 30)">
        <rect x="0" y="0" width="70" height="50" rx="4" fill="#ca8a04" />
        <text x="35" y="30" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">Hot-01</text>
        
        <rect x="85" y="0" width="70" height="50" rx="4" fill="#ca8a04" />
        <text x="120" y="30" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">Hot-02</text>
        
        <rect x="170" y="0" width="70" height="50" rx="4" fill="#ca8a04" />
        <text x="205" y="30" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">Hot-03</text>
      </g>
      <text x="140" y="110" font-family="Arial, sans-serif" font-size="10" fill="#fef08a" text-anchor="middle">High Performance SSD</text>
      <text x="140" y="125" font-family="Arial, sans-serif" font-size="10" fill="#fef08a" text-anchor="middle">Recent Logs / Ingest</text>
    </g>

    <!-- Warm Zone -->
    <g transform="translate(20, 210)">
      <rect width="280" height="240" rx="8" fill="#064e3b" fill-opacity="0.5" stroke="#22c55e" stroke-width="1" />
      <text x="140" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#4ade80" text-anchor="middle">Warm Data Nodes (x11)</text>
      
      <!-- Representing nodes as a grid grid -->
      <g transform="translate(20, 40)">
        <!-- Row 1 -->
        <rect x="0" y="0" width="55" height="40" rx="4" fill="#15803d" />
        <rect x="65" y="0" width="55" height="40" rx="4" fill="#15803d" />
        <rect x="130" y="0" width="55" height="40" rx="4" fill="#15803d" />
        <rect x="195" y="0" width="55" height="40" rx="4" fill="#15803d" />
        
        <!-- Row 2 -->
        <rect x="0" y="50" width="55" height="40" rx="4" fill="#15803d" />
        <rect x="65" y="50" width="55" height="40" rx="4" fill="#15803d" />
        <rect x="130" y="50" width="55" height="40" rx="4" fill="#15803d" />
        <rect x="195" y="50" width="55" height="40" rx="4" fill="#15803d" />
        
        <!-- Row 3 (Partial) -->
        <rect x="0" y="100" width="55" height="40" rx="4" fill="#15803d" />
        <rect x="65" y="100" width="55" height="40" rx="4" fill="#15803d" />
        <rect x="130" y="100" width="55" height="40" rx="4" fill="#15803d" />
        <text x="220" y="125" font-family="Arial, sans-serif" font-size="14" fill="#4ade80">...</text>
      </g>
      
      <text x="140" y="180" font-family="Arial, sans-serif" font-size="10" fill="#bbf7d0" text-anchor="middle">High Capacity Storage</text>
      <text x="140" y="195" font-family="Arial, sans-serif" font-size="10" fill="#bbf7d0" text-anchor="middle">Long-term Retention</text>
    </g>
  </g>

  <!-- Connectors: Logstash -> Cluster -->
  <line x1="420" y1="260" x2="470" y2="260" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />


  <!-- ==================== AREA 4: VISUALIZATION (Right) ==================== -->
  
  <g transform="translate(850, 200)">
    <rect width="120" height="120" rx="10" fill="#be185d" stroke="#fbcfe8" stroke-width="2" filter="url(#glow-source)" />
    <text x="60" y="65" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#fff" text-anchor="middle">Kibana</text>
    <text x="60" y="85" font-family="Arial, sans-serif" font-size="10" fill="#fce7f3" text-anchor="middle">Dashboards &amp;</text>
    <text x="60" y="100" font-family="Arial, sans-serif" font-size="10" fill="#fce7f3" text-anchor="middle">Reports</text>
  </g>

  <!-- Connectors: Cluster -> Kibana -->
  <line x1="800" y1="260" x2="840" y2="260" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

</svg>